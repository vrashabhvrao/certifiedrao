  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    :root { --bg: #050505; --surface: #111111; --border: #222222; --text-main: #ffffff; --text-muted: #888888; --accent: #333333; --font: 'Inter', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text-main); font-family: var(--font); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    a { text-decoration: none; color: inherit; transition: all 0.2s ease; }
    
    /* Navbar & Mobile Menu */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); position: relative; z-index: 100; background: var(--bg); }
    .brand { font-weight: 600; font-size: 1.1rem; letter-spacing: -0.5px; }
    .nav-links { display: flex; gap: 2rem; align-items: center; }
    .nav-links a { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
    .menu-toggle { display: none; background: none; border: none; color: var(--text-main); cursor: pointer; }

    .contact-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem; animation: fadeUp 0.8s ease-out; }
    .contact-container h1 { font-size: clamp(2rem, 5vw, 2.5rem); font-weight: 600; letter-spacing: -1px; margin-bottom: 1rem; }
    .contact-container p { color: var(--text-muted); margin-bottom: 3rem; max-width: 400px; }
    .email-link { font-size: clamp(1.2rem, 4vw, 2.5rem); font-weight: 500; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; word-break: break-all; }
    .email-link:hover { border-bottom-color: var(--text-main); }
    
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    @media (max-width: 768px) { 
      .navbar { padding: 1.5rem 2rem; } 
      .menu-toggle { display: block; }
      .nav-links { display: none; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: var(--surface); padding: 1.5rem; border-bottom: 1px solid var(--border); text-align: center; }
      .nav-links.active { display: flex; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <div class="brand"><a href="index.html">CERTIFIEDRAO</a></div>
      <button class="menu-toggle" id="mobile-menu-btn" aria-label="Toggle navigation menu">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html" class="active">Contact</a>
      </div>
    </nav>
  </header>

  <main class="contact-container">
    <h1>Let's build something.</h1>
    <p>Feel free to reach out regarding VLSI discussions, project collaborations, or engineering opportunities.</p>
    
    <a href="mailto:vrashabhvrao@certifiedrao.online" class="email-link">
      vrashabhvrao@certifiedrao.online
    </a>
  </main>

  <script>
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('nav-links').classList.toggle('active');
    });
  </script>
</body>
</html>
